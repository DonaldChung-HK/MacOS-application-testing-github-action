name: Manual Test Standalone macOS Java App

on:
  workflow_dispatch:
    inputs:
      zip_filename:
        description: 'Name or path of the zip file to test (e.g., app-release-mac.zip)'
        required: true
        default: 'app-release.zip'
        type: string

jobs:
  test-bundled-app:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Zip Archive
        run: |
          ZIP_FILE="${{ inputs.zip_filename }}"
          
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: Specified zip file '$ZIP_FILE' does not exist in the repository."
            exit 1
          fi
          
          echo "Extracting $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d extracted/

      - name: Locate Bundle & Ensure Executable Flags
        run: |
          APP_PATH=$(find extracted -name "*.app" -maxdepth 2)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found inside the zip file."
            exit 1
          fi
          
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          
          # Force execution permissions on the launcher binary inside the bundle
          chmod +x "$APP_PATH/Contents/MacOS/"*
          
          echo "Found app at: $APP_PATH"
      - name: Pre-grant Local Network Privacy Permissions
        run: |
          # Extract the Bundle Identifier from Info.plist
          BUNDLE_ID=$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleIdentifier 2>/dev/null || echo "")
          echo "Bundle ID: $BUNDLE_ID"

          if [ -n "$BUNDLE_ID" ]; then
            # Inject permission into the user TCC database
            TCC_DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
            mkdir -p "$(dirname "$TCC_DB")"
            
            # Insert access authorization for kTCCServiceLocalNetwork
            sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access VALUES('kTCCServiceLocalNetwork','$BUNDLE_ID',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));" || true
          fi
      - name: Launch Application GUI & Accept System Dialogs
        run: |
          APP_EXEC="$APP_PATH/Contents/MacOS/"*
          
          # Unset system JAVA_HOME to rely solely on the bundled JRE
          unset JAVA_HOME
          
          echo "Executing native bundle launcher..."
          $APP_EXEC &
          APP_PID=$!
          
          # Give the app and the system dialog 3 seconds to appear
          sleep 3
          
          # Trigger AppleScript to find and click "Allow" (or press Enter)
          echo "Attempting to auto-accept macOS permission prompt..."
          osascript -e '
            tell application "System Events"
              -- Wait up to 5 seconds for any modal dialog/button to appear
              repeat 5 times
                try
                  -- Attempt 1: Click "Allow" button if present
                  if exists (button "Allow" of window 1 of process "System Events") then
                    click button "Allow" of window 1 of process "System Events"
                    exit repeat
                  end if
                on error
                  -- Fallback: Press Enter/Return to accept the default action
                  key code 36
                end try
                delay 1
              end repeat
            end tell
          ' || true

          # Give the application another 5 seconds to load past the prompt
          sleep 5
          
          # Verify the application process is still active
          if kill -0 $APP_PID 2>/dev/null; then
            echo "SUCCESS: Application moved past prompt and is running!"
            
            # Capture the updated app UI screen
            screencapture -x app-window-success.png
            
            # Clean up app process
            kill -15 $APP_PID || kill -9 $APP_PID
          else
            echo "FAILURE: Application crashed after handling prompt."
            screencapture -x launch-crash.png || true
            exit 1
          fi

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-render-screenshot
          path: "*.png"
